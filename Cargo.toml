[package]
name = "pyrestoolbox-native"
version = "3.8.8"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Rust acceleration extensions for pyResToolbox"
homepage = "https://github.com/mwburgoyne/pyResToolbox"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
astro-float = "0.9.6"
pyo3 = { version = "0.23", features = ["extension-module"] }
rayon = "1.12.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
